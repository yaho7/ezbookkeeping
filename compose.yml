services:
  ezbookkeeping:
    image: ${EBK_IMAGE:-ghcr.io/yaho7/ezbookkeeping:latest}
    restart: unless-stopped
    ports:
      - "${EBK_PORT:-8080}:8080"
    environment:
      EBK_SECURITY_ENABLE_API_TOKEN: "true"
      EBK_SECURITY_SECRET_KEY: ${EBK_SECURITY_SECRET_KEY:?set EBK_SECURITY_SECRET_KEY in .env}
    volumes:
      - ezbookkeeping-data:/ezbookkeeping/data
      - ezbookkeeping-storage:/ezbookkeeping/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz.json"]
      interval: 10s
      timeout: 5s
      retries: 12

  email-bill-importer:
    image: ${BILL_IMPORTER_IMAGE:-ghcr.io/yaho7/ezbookkeeping-email-bill-importer:latest}
    restart: unless-stopped
    environment:
      EBK_SERVER_BASE_URL: http://ezbookkeeping:8080
      EBK_API_TOKEN: ${EBK_API_TOKEN:?set EBK_API_TOKEN in .env}
      MAIL_USER: ${MAIL_USER:?set MAIL_USER in .env}
      MAIL_PASS: ${MAIL_PASS:?set MAIL_PASS in .env}
      IMAP_SERVER: ${IMAP_SERVER:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      CMB_CREDIT_ACCOUNT_ID: ${CMB_CREDIT_ACCOUNT_ID:?set CMB_CREDIT_ACCOUNT_ID in .env}
      CMB_DEBIT_ACCOUNT_ID: ${CMB_DEBIT_ACCOUNT_ID:?set CMB_DEBIT_ACCOUNT_ID in .env}
      EXPENSE_CATEGORY_ID: ${EXPENSE_CATEGORY_ID:?set EXPENSE_CATEGORY_ID in .env}
      INCOME_CATEGORY_ID: ${INCOME_CATEGORY_ID:?set INCOME_CATEGORY_ID in .env}
      TZ: ${TZ:-Asia/Shanghai}
      MAX_EMAILS: ${MAX_EMAILS:-60}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-3600}
      RUN_ONCE: ${RUN_ONCE:-false}
      REQUIRE_AUTHENTICATION_RESULTS: ${REQUIRE_AUTHENTICATION_RESULTS:-true}
      TRUSTED_AUTHSERV_DOMAINS: ${TRUSTED_AUTHSERV_DOMAINS:-}
      STATE_PATH: /data/importer.db
    volumes:
      - email-bill-importer-data:/data
    depends_on:
      ezbookkeeping:
        condition: service_healthy

volumes:
  ezbookkeeping-data:
  ezbookkeeping-storage:
  email-bill-importer-data:
