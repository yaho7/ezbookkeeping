name: Build and Publish Docker Image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ezBookkeeping
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate immutable image metadata
        id: immutable_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long

      - name: Generate branch image metadata
        id: branch_meta
        if: github.ref_type == 'branch'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.immutable_meta.outputs.tags }}
          labels: ${{ steps.immutable_meta.outputs.labels }}
          cache-from: type=gha,scope=ezbookkeeping
          cache-to: type=gha,mode=max,scope=ezbookkeeping

      - name: Publish current branch tags
        if: github.ref_type == 'branch'
        shell: bash
        env:
          SOURCE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          BRANCH_TAGS: ${{ steps.branch_meta.outputs.tags }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [[ "${current_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Skipping mutable tags because this commit is no longer the branch head."
            exit 0
          fi

          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              tag_args+=(--tag "${tag}")
            fi
          done <<< "${BRANCH_TAGS}"
          docker buildx imagetools create "${tag_args[@]}" "${SOURCE_IMAGE}"
