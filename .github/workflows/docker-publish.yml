name: Build and Publish Docker Image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ezBookkeeping (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.suffix }}
          build-args: |
            BUILD_PIPELINE=1
          cache-from: type=gha,scope=ezbookkeeping-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=ezbookkeeping-${{ matrix.suffix }}

  publish:
    name: Publish image and branch tags
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docker-mutable-tags-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate branch image metadata
        if: github.ref_type == 'branch'
        id: branch_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          BRANCH_TAGS: ${{ steps.branch_meta.outputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_args=(--tag "${IMAGE}:sha-${GITHUB_SHA}")
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
            if [[ "${current_sha}" == "${GITHUB_SHA}" ]]; then
              while IFS= read -r tag; do
                if [[ -n "${tag}" ]]; then
                  tag_args+=(--tag "${tag}")
                fi
              done <<< "${BRANCH_TAGS}"
            else
              echo "Publishing only the immutable tag because this commit is no longer the branch head."
            fi
          fi
          docker buildx imagetools create "${tag_args[@]}" \
            "${IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE}:sha-${GITHUB_SHA}-arm64"
